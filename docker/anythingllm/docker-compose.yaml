services:
    anythingllm:
        ports:
            - 3001:3001
        cap_add:
            - SYS_ADMIN
        container_name: anythingllm
        volumes:
            - $HOME/applications/anythingllm:/app/server/storage
            - $HOME/applications/anythingllm/.env:/app/server/.env
            - $HOME/applications/anythingllm/anythingllm-fs:/app/server/storage/anythingllm-fs
            - $HOME/Documents/github/anything-llm:/app/server/storage/anythingllm-fs/anythingllm-repo:ro
            - $HOME/Documents/github/ctxpact:/app/server/storage/anythingllm-fs/ctxpact-repo:ro
            - $HOME/Documents/github/engineering-research-project:/app/server/storage/anythingllm-fs/project:ro
            - $HOME/Documents/github/linux/bash:/app/server/storage/anythingllm-fs/scripts:ro
        environment:
            - STORAGE_DIR=/app/server/storage
        image: mintplexlabs/anythingllm:latest
        restart: unless-stopped
